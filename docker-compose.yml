# Локальный запуск API и отдельной команды миграций.
# Состав, подключение к базе и порядок запуска: docs/deployment.md.
services:
  speech-ms:
    build:
      context: .
      target: speech-ms
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ${SPEECH_MS_IMAGE:-speech-backend:local}
    restart: unless-stopped
    read_only: true
    ports:
      - "127.0.0.1:${AICISTENT_SPEECH_MS_DOCKER_PORT:-18096}:8096"
    # Временные файлы отчётов ограничены памятью, доступной этому tmpfs.
    tmpfs:
      - /tmp:size=1g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      APP_ENV: ${APP_ENV:-local}
      SPEECH_MS_DATABASE_URL: ${AICISTENT_DOCKER_SPEECH_MS_DATABASE_URL:?Set API database URL in .env}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      SPEECH_AUTH_MODE: ${SPEECH_AUTH_MODE:-open}
      SPEECH_KEYCLOAK_ISSUER_URL: ${SPEECH_KEYCLOAK_ISSUER_URL:-}
      SPEECH_KEYCLOAK_JWKS_URL: ${SPEECH_KEYCLOAK_JWKS_URL:-}
      SPEECH_KEYCLOAK_AUDIENCE: ${SPEECH_KEYCLOAK_AUDIENCE:-}
      SPEECH_KEYCLOAK_URL: ${SPEECH_KEYCLOAK_URL:-}
      SPEECH_KEYCLOAK_REALM: ${SPEECH_KEYCLOAK_REALM:-}
      SPEECH_KEYCLOAK_CLIENT_ID: ${SPEECH_KEYCLOAK_CLIENT_ID:-}
      SPEECH_KEYCLOAK_CLIENT_SECRET: ${SPEECH_KEYCLOAK_CLIENT_SECRET:-}
      SPEECH_PUBLIC_BASE_URL: ${SPEECH_PUBLIC_BASE_URL:-}
      SPEECH_SESSION_TTL_SECONDS: ${SPEECH_SESSION_TTL_SECONDS:-43200}
      SPEECH_SESSION_REFRESH_SECONDS: ${SPEECH_SESSION_REFRESH_SECONDS:-900}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-auto}
      SPEECH_DISPLAY_TIMEZONE: ${SPEECH_DISPLAY_TIMEZONE:-Europe/Moscow}
      SPEECH_STORAGE_BASE_URL: ${SPEECH_STORAGE_BASE_URL:-}
      SPEECH_STORAGE_BUCKET: ${SPEECH_STORAGE_BUCKET:-speech-recordings}
      SPEECH_STORAGE_REGION: ${SPEECH_STORAGE_REGION:-us-east-1}
      SPEECH_STORAGE_ACCESS_KEY_ID: ${SPEECH_STORAGE_ACCESS_KEY_ID:-}
      SPEECH_STORAGE_SECRET_KEY: ${SPEECH_STORAGE_SECRET_KEY:-}
      SPEECH_STORAGE_TIMEOUT_SECONDS: ${SPEECH_STORAGE_TIMEOUT_SECONDS:-60}
      SPEECH_METRICS_KEY: ${SPEECH_METRICS_KEY:-}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/ready', timeout=2).read()"
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    networks:
      - default
      - data

  migrate-speech:
    profiles: ["operations"]
    build:
      context: .
      target: migrations
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    image: ${SPEECH_MIGRATIONS_IMAGE:-speech-backend-migrations:local}
    command: ["alembic", "-c", "alembic.ini", "upgrade", "head"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SPEECH_MS_DATABASE_URL: ${AICISTENT_DOCKER_SPEECH_MS_MIGRATE_DATABASE_URL:?Set migrations database URL in .env}
    networks:
      - data

# API также использует стандартную сеть Compose для HTTP к внешним сервисам.
networks:
  data:
    external: true
    name: ${SPEECH_DOCKER_NETWORK:-speech-data}
