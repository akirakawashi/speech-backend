[project]
name = "speech-backend"
version = "0.1.0"
description = "Speech analytics API and database migrations."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.141.1,<0.142",
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.14.1,<3",
  "typing-extensions>=4.12.2,<5",
  "uvicorn[standard]>=0.49.0,<0.50",
  "openpyxl>=3.1.5,<4",
  "httpx>=0.28.1,<0.29",
  "python-jose[cryptography]>=3.5.0,<4",
  "sqlalchemy[asyncio]>=2.0.50,<2.1",
  "asyncpg>=0.31.0,<0.32",
  "tzdata>=2026.1",
]

[project.scripts]
speech-analyze = "src.presentation.cli.analysis_processor:main"
speech-process = "src.presentation.cli.speech_processor:main"
speech-evaluate = "src.presentation.cli.evaluate:main"
speech-reanalyze = "src.presentation.cli.reanalyze:main"
speech-fill-reasons = "src.presentation.cli.fill_reasons:main"
speech-classifier-backfill = "src.presentation.cli.classifier_backfill:main"
speech-seed-classifier = "src.presentation.cli.seed_classifier:main"
speech-seed-call-reasons = "src.presentation.cli.seed_call_reasons:main"
speech-compare-models = "src.presentation.cli.compare_models:main"

[dependency-groups]
migrations = ["alembic>=1.18.4,<2"]
dev = [
  { include-group = "migrations" },
  "mypy>=2.3.0,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4.0,<2",
  "ruff>=0.16.0,<0.17",
  "PyYAML>=6,<7",
  "types-openpyxl>=3.1.5,<4",
  "types-python-jose>=3.5,<4",
  "types-PyYAML>=6,<7",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.18"

[tool.uv.build-backend]
module-name = "src"
module-root = ""
source-include = ["alembic/**", "alembic.ini", "openapi.speech.json"]

[tool.pytest.ini_options]
minversion = "9.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-tmp -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["alembic"]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Body",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
strict = false
disable_error_code = [
  "no-untyped-def",
  "no-untyped-call",
  "attr-defined",
  "type-arg",
  "index",
  "arg-type",
  "call-overload",
  "unused-ignore",
]
